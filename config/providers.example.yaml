voice:
  primary: gemini-live
  # Add fallback IDs only for voice adapters that are actually implemented.
  # GPT-Live and chained STT -> brain -> TTS remain roadmap adapters.
  fallbacks: []

brain:
  primary: deepseek
  fallbacks:
    - hermes
    - openrouter

search:
  # Dedicated web search stays separate from the voice/brain provider.
  # SearXNG must have JSON output enabled in its search.formats settings.
  primary: searxng
  fallbacks: []

memory:
  primary: local

providers:
  gemini-live:
    kind: voice
    adapter: gemini-live
    model: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
    api_key_env: GEMINI_API_KEY
    # Transcription creates extra provider output/usage. Keep it opt-in.
    input_transcription: false
    output_transcription: false

  searxng:
    kind: search
    adapter: searxng
    base_url: ${SEARXNG_BASE_URL:-http://127.0.0.1:8080}
    timeout_ms: 8000

  deepseek:
    kind: brain
    adapter: openai-compatible
    base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:-deepseek-flash}
    api_key_env: DEEPSEEK_API_KEY

  hermes:
    kind: brain
    adapter: openai-compatible
    base_url: ${HERMES_BASE_URL:-http://127.0.0.1:8642/v1}
    model: ${HERMES_MODEL:-hermes}
    api_key_env: HERMES_API_KEY

  openrouter:
    kind: brain
    adapter: openai-compatible
    base_url: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:-openrouter/auto}
    api_key_env: OPENROUTER_API_KEY
