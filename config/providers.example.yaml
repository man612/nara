voice:
  primary: gemini-live
  # The chained adapter is implemented but opt-in because deployments must
  # choose their own STT/TTS endpoints. Add "chained" here after configuring
  # the speech providers below. GPT-Live remains roadmap work.
  fallbacks: []

brain:
  primary: deepseek
  fallbacks:
    - hermes
    - openrouter

search:
  # Dedicated web search stays separate from the voice/brain provider.
  # SearXNG must have JSON output enabled in its search.formats settings.
  primary: searxng
  fallbacks: []

memory:
  primary: local

providers:
  gemini-live:
    kind: voice
    adapter: gemini-live
    model: ${GEMINI_LIVE_MODEL:-gemini-3.8-live}
    api_key_env: GEMINI_API_KEY
    # Transcription creates extra provider output/usage. Keep it opt-in.
    input_transcription: false
    output_transcription: false

  # Optional cost/self-host friendly voice path. It reuses the brain route
  # above and preserves Nara Action Runtime tool calls.
  chained:
    kind: voice
    adapter: chained
    stt_provider: speech-stt
    tts_provider: speech-tts
    system_instruction: ${NARA_CHAINED_SYSTEM_INSTRUCTION:-Be concise and natural.}

  # Any server exposing the OpenAI-compatible audio endpoints can sit here.
  # Omit api_key_env for an unauthenticated localhost gateway.
  speech-stt:
    kind: stt
    adapter: openai-compatible
    base_url: ${NARA_STT_BASE_URL:-http://127.0.0.1:8001/v1}
    model: ${NARA_STT_MODEL:-whisper-1}
    language: ${NARA_STT_LANGUAGE:-id}
    timeout_ms: 30000

  speech-tts:
    kind: tts
    adapter: openai-compatible
    base_url: ${NARA_TTS_BASE_URL:-http://127.0.0.1:8002/v1}
    model: ${NARA_TTS_MODEL:-tts-1}
    voice: ${NARA_TTS_VOICE:-alloy}
    sample_rate: 24000
    timeout_ms: 30000

  searxng:
    kind: search
    adapter: searxng
    base_url: ${SEARXNG_BASE_URL:-http://127.0.0.1:8080}
    timeout_ms: 8000

  deepseek:
    kind: brain
    adapter: openai-compatible
    base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:-deepseek-flash}
    api_key_env: DEEPSEEK_API_KEY

  hermes:
    kind: brain
    adapter: openai-compatible
    base_url: ${HERMES_BASE_URL:-http://127.0.0.1:8642/v1}
    model: ${HERMES_MODEL:-hermes}
    api_key_env: HERMES_API_KEY

  openrouter:
    kind: brain
    adapter: openai-compatible
    base_url: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    model: ${OPENROUTER_MODEL:-openrouter/auto}
    api_key_env: OPENROUTER_API_KEY
