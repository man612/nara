services:
  nara:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: 8787
      NARA_DEVICE_REGISTRY_FILE: /app/data/device-registry.json
      HERMES_BASE_URL: ${HERMES_BASE_URL:-http://hermes:8642/v1}
    volumes:
      - nara-data:/app/data
    ports:
      - "${NARA_PORT:-8787}:8787"
    networks:
      - companion

  hermes:
    profiles: ["hermes"]
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: ${HERMES_API_KEY}
    volumes:
      - hermes-data:/opt/data
    expose:
      - "8642"
    networks:
      - companion
networks:
  nara:
    driver: bridge

volumes:
  nara-data:
  hermes-data:
